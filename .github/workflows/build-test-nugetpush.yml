name: build-test-nugetpush

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.txt'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Git - check out repository code
        uses: actions/checkout@v7

      - name: .NET - setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: .NET - restore & build
        run: dotnet build

      - name: .NET - test
        run: dotnet test

      - name: NuGet login
        if: github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: login
        with:
          user: mrshrinkray

      - name: Nuget - push tag package
        if: startsWith(github.ref, 'refs/tags/v') && github.actor == github.repository_owner
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          dotnet pack src/TextTemplate/TextTemplate.csproj -c Release /p:PackageVersion=$VERSION
          dotnet nuget push "src/TextTemplate/bin/Release/go-text-template.$VERSION.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
